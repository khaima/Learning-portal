name: Tests

# Every push, and every pull request. The api Edge Function's full suite
# runs against an in-memory stand-in for Supabase — no database, no network,
# no secrets needed (supabase/functions/api/test_world.ts). A push to
# `staging` is tested by the release instead, which calls this workflow and
# goes on to production only if it passes (release.yml).
on:
  push:
    branches-ignore: [staging]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api Edge Function — type check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: supabase/functions/api
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check
        run: deno task check
      # Every *_test.ts: the role × endpoint access matrix (authz_test.ts),
      # school walls, field officers' schools, PIN lockout and non-active
      # accounts (isolation_test.ts), and the domain rules. The output is
      # kept, so a failure that doesn't happen again can still be read.
      - name: Tests
        shell: bash
        run: NO_COLOR=1 deno task test --junit-path=test-results.xml 2>&1 | tee test-output.txt
      - name: Name the failing tests
        if: failure()
        shell: bash
        run: |
          {
            echo "### API tests that failed"
            echo '```'
            grep -E "\.\.\. FAILED|^error:|=> " test-output.txt | head -60 || echo "(see the test-output artifact)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            supabase/functions/api/test-output.txt
            supabase/functions/api/test-results.xml
          retention-days: 30
          if-no-files-found: ignore

  frontend:
    name: Frontend — build, CSP agrees, sign-in page within budget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Every name in the pages' code is defined (no type checker here).
      - name: Lint
        run: npm run lint
      # Bundles, minifies and fingerprints every page; writes the service worker.
      - name: Build
        run: npm run build
      # The CSP in vercel.json and the built pages agree: no inline code it
      # would block, no script or stylesheet from a host it doesn't allow,
      # no code imported from a URL, and the service worker's files exist.
      - name: Content-Security-Policy check
        run: node scripts/check-csp.mjs
      # What each page downloads; fails if the sign-in page's JavaScript
      # (minified, before compression) goes over 150 KB.
      - name: Bundle sizes
        run: node scripts/bundle-report.mjs --budget=150
